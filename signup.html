<!DOCTYPE html>
<html>
<head>
    <title>Signup - Relaxo Monitor</title>

    <style>

        body{
            margin:0;
            padding:0;
            background:#020617;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:350px;
            background:#1e293b;
            padding:40px;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,0.4);
            text-align:center;
        }

        h1{
            color:white;
            margin-bottom:30px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:none;
            border-radius:8px;
            outline:none;
            font-size:15px;
        }

        button{
            width:100%;
            padding:12px;
            background:#3b82f6;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            margin-top:15px;
        }

        button:hover{
            background:#2563eb;
        }

        p{
            color:#cbd5e1;
            margin-top:20px;
        }

        a{
            color:#38bdf8;
            text-decoration:none;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Create Account</h1>

    <form method="POST">

        <input type="email" name="email" placeholder="Enter Email" required>

        <input type="password" name="password" placeholder="Enter Password" required>

        <button type="submit">Signup</button>

    </form>

    <p>
        Already have an account?
        <a href="/login">Login</a>
    </p>

</div>

</body>
</html>
